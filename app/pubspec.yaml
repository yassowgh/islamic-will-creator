name: islamic_will_creator
description: Islamic Inheritance Will Creator (UK) - wasiyya + faraid.
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter: {sdk: flutter}
  flutter_localizations: {sdk: flutter}
  intl: any
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  cloud_functions: ^5.0.0
  firebase_app_check: ^0.3.0
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.0   # feature-flagged until Apple Dev account
  fl_chart: ^0.68.0
  google_mlkit_text_recognition: ^0.13.0
  cunning_document_scanner: ^1.2.0
  file_picker: ^8.0.0
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  generate: true   # gen-l10n from lib/l10n/*.arb
