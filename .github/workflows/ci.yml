name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest
      - run: cd functions && python -m pytest faraid_engine/tests -q
  flutter:
    runs-on: ubuntu-latest
    continue-on-error: true  # Dart not yet verified locally
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: cd app && flutter pub get
      - run: cd app && flutter analyze
      - run: cd app && flutter test
      - run: cd app && flutter build web --release
      - uses: actions/upload-artifact@v4
        with: {name: web-build, path: app/build/web}
  android-apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: cd app && flutter pub get && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: {name: app-release-apk, path: app/build/app/outputs/flutter-apk/app-release.apk}
  deploy-hosting:
    needs: [engine-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deploys the working website/ prototype. Once the Flutter web app
      # is verified, switch firebase.json hosting.public to app/build/web
      # and add the flutter build step back here.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
      - name: Deploy Firestore rules (no-op until Firestore is enabled)
        continue-on-error: true
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          npx -y firebase-tools deploy --only firestore:rules --project islamic-will-creator-9cedf --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
